<c-card class="dashboard-parent-card h-100">
  <c-card-body>

    <h2 class="fw-bold mb-4">Driver Performance</h2>

    <div class="row g-4">

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-primary">0</div>
          <div class="metric-label">Avg Trips</div>
        </div>
      </div>

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-success">₹0</div>
          <div class="metric-label">Avg Earnings</div>
        </div>
      </div>

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-warning">0</div>
          <div class="metric-label">Avg Rating</div>
        </div>
      </div>

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-info">0 km</div>
          <div class="metric-label">Avg Distance</div>
        </div>
      </div>

    </div>

  </c-card-body>
</c-card>
