
<c-card class="dashboard-parent-card h-100">
  <c-card-body>

    <h2 class="fw-bold mb-4">Vehicle Health Status</h2>

    <div class="row g-4">

      <div class="col-4">
        <div class="metric-card">
          <div class="metric-value text-primary">0</div>
          <div class="metric-label">ALL</div>
        </div>
      </div>

      <div class="col-4">
        <div class="metric-card">
          <div class="metric-value text-success">0</div>
          <div class="metric-label">ACTIVE</div>
        </div>
      </div>

      <div class="col-4">
        <div class="metric-card">
          <div class="metric-value text-danger">0</div>
          <div class="metric-label">Accident</div>
        </div>
      </div>

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-warning">0</div>
          <div class="metric-label">Service</div>
        </div>
      </div>

      <div class="col-6">
        <div class="metric-card">
          <div class="metric-value text-secondary">0</div>
          <div class="metric-label">Repair</div>
        </div>
      </div>

    </div>

  </c-card-body>
</c-card>
