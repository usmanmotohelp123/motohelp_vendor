<div class="login-wrapper">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <div class="logo-box">
      <img src="assets/images/image-Vendor.png" class="logo" />
      <div class="lang-section">
        <h1>choose your preferred language</h1>
        <label><input type="radio" name="lang" checked> English</label>
        <label><input type="radio" name="lang"> Marathi</label>
        <label><input type="radio" name="lang"> Hindi</label>
        <label><input type="radio" name="lang"> Gujarati</label>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-box">

      <h1>Hi, Welcome To Motohelp</h1>

      <p class="subtitle">Enter Mobile number for verification</p>

      <div class="mobile-input justify-center">
        <select>
          <option>+91</option>
        </select>
        <input type="number" [(ngModel)]="mobileData.mobile" placeholder="Enter Mobile Number" minlength="10" maxlength="10" required (ngModelChange)="onMobileChange($event)">
      </div>

      <p class="otp-text justify-content-start">Check your SMS For OTP</p>

      <!-- <div class="otp-box justify-center">
        <input maxlength="1" [(ngModel)]="otp1">
        <input maxlength="1" [(ngModel)]="otp2">
        <input maxlength="1" [(ngModel)]="otp3">
        <input maxlength="1" [(ngModel)]="otp4">
      </div> -->
      <div class="otp-box justify-center">
        <input  maxlength="1" [(ngModel)]="otp1"
              (input)="moveNext($event, otp2Ref)"
              #otp1Ref>

        <input  maxlength="1" [(ngModel)]="otp2"
              (input)="moveNext($event, otp3Ref)"
              (keydown.backspace)="movePrev($event, otp1Ref)"
              #otp2Ref>

        <input  maxlength="1" [(ngModel)]="otp3"
              (input)="moveNext($event, otp4Ref)"
              (keydown.backspace)="movePrev($event, otp2Ref)"
              #otp3Ref>

        <input  maxlength="1" [(ngModel)]="otp4"
              (keydown.backspace)="movePrev($event, otp3Ref)"
              #otp4Ref>
      </div>

      <p class="timer">Your OTP will expire in <span>{{counter}}</span> seconds.</p>
      <!-- <p class="timer" *ngIf="otpmessage && counter !== 0">{{otpmessage}}</p> -->
      <button class="verify-btn" (click)="verifyOtp(mobileData)">
        Verify
      </button>

    </div>
  </div>

</div>
