<div class="login-wrapper">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <div class="logo-box">
      <img src="assets/images/figma-icons/Logo.png" class="logo" />
      <h1 class="company">ABC Company</h1>
      <div class="lang-section">
        <h1>choose your preferred language</h1>
        <label><input type="radio" name="lang" checked> English</label>
        <label><input type="radio" name="lang"> Marathi</label>
        <label><input type="radio" name="lang"> Hindi</label>
        <label><input type="radio" name="lang"> Gujarati</label>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-box">

      <h1>Hi, Welcome To Motohelp</h1>

      <p class="subtitle">Enter Mobile number for verification</p>

      <div class="mobile-input justify-center">
        <select>
          <option>+91</option>
        </select>
        <!-- <input type="number" [(ngModel)]="mobileData.mobile" placeholder="Enter Mobile Number" minlength="10" maxlength="10" required>(ngModelChange)="onMobileChange($event)" -->
          <input type="tel" [(ngModel)]="mobileData.mobile" placeholder="Enter Mobile Number"
              minlength="10" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" required/><!--(input)="mobileData.mobile = mobileData.mobile.slice(0, 10)"-->
      </div>

      <p *ngIf="isOtpSent" class="otp-text justify-content-start">Check your SMS For OTP</p>
      <div *ngIf="isOtpSent" class="otp-box justify-center">
        <input  maxlength="1" [(ngModel)]="otp1" (input)="moveNext($event, otp2Ref)"#otp1Ref>
        <input  maxlength="1" [(ngModel)]="otp2" (input)="moveNext($event, otp3Ref)" (keydown.backspace)="movePrev($event, otp1Ref)" #otp2Ref>
        <input  maxlength="1" [(ngModel)]="otp3" (input)="moveNext($event, otp4Ref)" (keydown.backspace)="movePrev($event, otp2Ref)" #otp3Ref>
        <input  maxlength="1" [(ngModel)]="otp4" (keydown.backspace)="movePrev($event, otp3Ref)" #otp4Ref>
      </div>
       <p *ngIf="isOtpSent" class="timer">Your OTP will expire in <span>{{counter}}</span> seconds.</p>
       <button *ngIf="!isOtpSent" type="submit" class="verify-btn" (click)="sendOtp()">Send OTP</button>
       <button *ngIf="counter !== 0 && isOtpSent" class="verify-btn" (click)="verifyOtp(mobileData)">Verify</button>
       <button *ngIf="counter === 0 && isOtpSent" type="button" class="verify-btn" (click)="resendOtp()">Resend OTP</button>
      </div>
  </div>

</div>
