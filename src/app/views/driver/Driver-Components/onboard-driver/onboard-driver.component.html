  <div class="onboard-container information text-center"><!--*ngIf="isVerified"-->
     <div class="toggle-btns" *ngIf="!driverDetailsEnable">
        <button class="btn1" [ngClass]="informationEnable===true ? 'active':' outline'" (click)="toggleInformationButton()">Personal Information</button>
        <button class="btn1" [ngClass]="informationEnable===false ? 'active':' outline'" (click)="toggleInformationButton()" style="margin-left: -15px;">Address & KYC</button>
     </div>
     <div class="form-wrapper" *ngIf="informationEnable && !driverDetailsEnable">
      <form [formGroup]="driverFormPersonalInformation">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder=" " formControlName="license_no" readonly/>
                <label for="license">License Number</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <!-- <input type="date" formControlName="dob" readonly [(ngModel)]="driverDob"/> -->
                <input type="text" formControlName="dob" readonly/>
                <label for="dob">Date of Birth </label>
            </div>
          </div>
         </div>
          <div class="row input-wrapper mt-4">    
           <div class="col-md-12 d-flex justify-content-start" >
             <Span style="font-size: large; color: black; font-weight: 600; margin-bottom: -10px; margin-left: 10px;">Driving License</Span>
           </div>
          </div>
          <div class="row input-wrapper mt-4">    
            <div class="col-md-6">
              <div class="input-box">
                  <input type="text" placeholder="" [value]="frontFileName || ''"/>
                  <label for="dob">Front Image</label>
                  <img src="assets/images/Camera-Icon.png" (click)="openImagePreview(baseUrl+driverDetails?.LicenseFrontImage, 'License Front Image')" style="cursor:pointer;">
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-box">
                  <input type="text" placeholder="" [value]="frontFileName || ''"/>
                  <label for="dob">Back Image</label>
                  <img src="assets/images/Camera-Icon.png" (click)="openImagePreview(baseUrl+driverDetails?.LicenseBackImage, 'License Back Image')" style="cursor:pointer;">
              </div>
            </div>
          </div>
        <!-- DL IMAGES -->

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="phone_number" readonly/>
                <label for="dob">Phone Number</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="full_name" readonly/>
                <label for="dob">Full Name As Per DL</label>
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="nick_name" readonly/>
                <label for="dob">Nick Name</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="email" readonly/>
                <label for="dob">Email Id</label>
            </div>
          </div>
         </div>

         <button type="button" class="next-btn" style="margin-left: -40px; margin-top: 50px;" (click)="onNext()">Next  <i class="fa fa-arrow-right"></i></button> <!-- (click)="toggleInformationButton()"-->
       </form>
     </div>

      <!--For Kyc info-->
     <div class="form-wrapper" *ngIf="!informationEnable && !driverDetailsEnable">
       <form [formGroup]="driverFormAddressKyc">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="building" readonly/>
                <label for="dob">Building , Apartment</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
               <input type="text" placeholder="" formControlName="street" readonly/>
               <label for="dob">Street , Area</label>
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="pincode" (change)="getPincodeLocation($event)" readonly/>
                <!-- <img src="assets/images/Camera-Icon.png"> -->
                <label for="dob">Pincode</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" formControlName="tahsil" readonly/>
                <!-- <img src="assets/images/Camera-Icon.png"> -->
                <label for="dob">Town/Tahsil</label>
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <select formControlName="state" (click)="getStateData()" readonly>
                  <!-- <Option selected disabled value="">Select State</Option> -->
                  <option *ngFor="let state of stateList" [value]="state.state">{{state.state}}</option>
                </select>
                <label for="dob">State</label>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
               <select formControlName="district" style="border: none; outline: none; width: 100%;" (click)="getCityData()" readonly>
                  <!-- <Option selected disabled value="">District</Option> -->
                  <option *ngFor="let city of cityList" [value]="city.district">{{city.district}}</option>
                </select>
                <label for="dob">District</label>
            </div>
          </div>
         </div>

         <div class="row input-wrapper mt-4">    
           <div class="col-md-12 d-flex justify-content-start" >
             <Span style="font-size: large;color: black; font-weight: 600; margin-bottom: -10px; margin-left: 10px;">Adhaar Card</Span>
           </div>
          </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-4">
            <div class="input-box" style="width: 88%;">
                <input type="text" placeholder="" formControlName="adhaar" readonly/>
                <label for="dob">Adhaar Card Number</label>
            </div>
          </div>

           <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="" [value]="frontAdhaarImg || ''" readonly/>
                <label for="dob">Front Image</label>
                <img src="assets/images/Camera-Icon.png"  (click)="openImagePreview(baseUrl+driverDetails?.AadharFrontImage, 'Aadhaar Front Image')" style="cursor:pointer;">
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="" [value]="backAdhaarImg || ''" readonly/>
                <label for="dob">Back Image</label>
                <img src="assets/images/Camera-Icon.png" (click)="openImagePreview(baseUrl+driverDetails?.AadharBackImage, 'Aadhaar Back Image')" style="cursor:pointer;">
            </div>
          </div>

        </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-4">
            <div class="input-box" style="width: 88%;">
                <input type="text" placeholder="" formControlName="familyMemberApp" readonly/>
                <label for="dob">Name Of Family Member</label>
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box" style="width: 88%;">
                <input type="text" placeholder="" formControlName="phoneNumber" readonly/>
                <label for="dob">Phone Number</label>
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box" style="width: 88%;">
                <select formControlName="realation" readonly>
                   <!-- <Option selected disabled value="">Realation</Option> -->
                   <Option value="Mother">Mother</Option>
                   <Option  value="Father">Father</Option>
                </select>
                <label for="dob">Realation</label>
            </div>
          </div>
         </div>
         <button type="button" class="next-btn" style="margin-left: -60px; margin-top: 30px;" (click)="toggleDriverDetailsButton()">Next <i class="fa fa-arrow-right"></i></button>
       </form>
     </div>


    <!--Infomation of Driver-->
     <div class="form-wrapper mt-0" *ngIf="driverDetailsEnable">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="" [(ngModel)]="drivingLicense" readonly/>
                <label for="dob">Driving License</label>
            </div>
          </div>
           <div class="col-md-3">
            <div class="input-box">
                <input type="text" placeholder=""  [(ngModel)]="driverDob" readonly/>
                <label for="dob">Date Of Birth</label>
            </div>
          </div>
         </div>
         
         <!-- <div class="row input-wrapper mt-3">    
           <div class="col-md-12 d-flex justify-content-center" >
              <button type="button" class="verify-btn" (click)="verifyLicense()">Verify License</button>
           </div>
          </div> -->

          <div class="row input-wrapper mt-4">    
            <div class="col-md-12 d-flex justify-content-center">
              <button *ngIf="isVerifying" class="verify-btn2" disabled>
                <span class="spinner-border spinner-border-sm"></span>Verifying...
              </button>
              <button *ngIf="!isVerifying && isLicenseVerified" class="verify-btn2 verified-btn" disabled>
                ✔ Verified
              </button>
              <button *ngIf="!isVerifying && !isLicenseVerified" type="button" class="verify-btn2" (click)="verifyLicense()">
                Verify License
              </button>
            </div>
          </div>
        
         <div class="mt-3"><!--*ngIf="!isVerifying && isLicenseVerified"-->
          <div class="row input-wrapper mt-2">    
            <div class="col-md-12 d-flex justify-content-start" >
              <div class="head">
                <h2>Information As Per Driving License</h2>
                <div class="underline-driving"></div>
              </div>
            </div>
          </div>  

          <div class="row input-wrapper mt-2">    
            <div class="col-md-3">
              <div class="input-box">
                  <input type="text" placeholder="Full Name As Per DL" [(ngModel)]="drivingLicenseName"/>
              </div>
            </div>
            <div class="col-md-9">
              <div class="input-box">
                  <input type="text" placeholder="Address As Per Driving License" [(ngModel)]="drivingLicenseAddress"/>
              </div>
            </div>
          </div>

          <div class="row input-wrapper mt-4">    
          <div class="col-md-12">
            <table class="infomation-table">
                <thead>
                  <th>Code</th>
                  <th>Date Of Issue</th>
                  <th>Date Of Expiry</th>
                </thead>
                <tbody>
                  <tr *ngFor="let driver of driversDetailsByLicense.vehicleClasses"> 
                    <td>{{driver.class}}</td>
                    <td>{{driver.issueDate}}</td>
                    <!-- <td>{{driver.t_validity_to}}</td> -->
                    <td>{{ getExpiryDate(driver.class) }}</td>
                  </tr>
                  <!-- <tr>
                    <td>84845</td>
                    <td>19-09-200</td>
                    <td>19-12-2025</td>
                  </tr>
                  <tr>
                    <td>84845</td>
                    <td>19-09-200</td>
                    <td>19-12-2025</td>
                  </tr>
                  <tr>
                    <td>84845</td>
                    <td>19-09-200</td>
                    <td>19-12-2025</td>
                  </tr> -->
                </tbody>
            </table>
            </div>
          </div>
          <button type="button" class="submit-btn" style="margin-left: -50px; margin-top: 20px;" (click)="submitDriverData()">Submit</button><!--routerLink="/driverList"-->
         </div> 

     </div>
  </div>

</div>





<div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header1 d-flex justify-content-between" style="margin-bottom: 0; padding: 5px 8px;border-bottom: 1px solid #D9D9D9;">
        <h3 class="modal-title" style="margin-bottom: 0;">{{ previewImageTitle }}</h3>
        <button type="button" style="margin-bottom: 0;" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img *ngIf="previewImageUrl" [src]="previewImageUrl" [alt]="previewImageTitle" style="max-width: 100%; max-height: 70vh; object-fit: contain;"/>
        <p *ngIf="!previewImageUrl" class="text-danger">
          Image not available.
        </p>
      </div>
    </div>
  </div>
</div>
