<div class="container-fluid">
    <div class="head">
        <h1>Onboard Driver</h1>
        <div class="underline"></div>
    </div>
   

   <div class="onboard-container text-center" *ngIf="!isVerified">

     <div class="toggle-btns">
        <button class="btn" [ngClass]="qrEnable===true ? 'active':' outline'" (click)="toggleQrButton()">QR Code</button>
        <button class="btn" [ngClass]="qrEnable===false ? 'active':' outline'" (click)="toggleQrButton()">User Id</button>
     </div>

     <div class="qr-wrapper" *ngIf="qrEnable">
       <div class="qr-border">
         <span class="corner top-left"></span>
         <span class="corner top-right"></span>
         <span class="corner bottom-left"></span>
         <span class="corner bottom-right"></span>
         <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Driver123" />
        </div>
     </div>

    <!-- <div class="user-id-wrapper" *ngIf="!qrEnable">
      <div class="user-id">
        <span>User ID : UID473893</span> 
      </div> 
    </div> -->
    <div class="user-id-wrapper" *ngIf="!qrEnable">
      <div class="user-id">
        <input type="text" class="user-id-input" [(ngModel)]="userId" placeholder="User ID : UID473893" />
      </div>
    </div>

     <button class="verify-btn"  (click)="verifyDriver()">Verify</button>

   </div>


   <!--After Verified-->
  <div class="onboard-container information text-center" *ngIf="isVerified">

     <div class="toggle-btns" *ngIf="!driverDetailsEnable">
        <button class="btn" [ngClass]="informationEnable===true ? 'active':' outline'" (click)="toggleInformationButton()">Personal Information</button>
        <button class="btn" [ngClass]="informationEnable===false ? 'active':' outline'" (click)="toggleInformationButton()">Address & KYC</button>
     </div>

     <!--Personal info-->
     <div class="form-wrapper" *ngIf="informationEnable && !driverDetailsEnable">
      <form [formGroup]="driverFormPersonalInformation">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="License" formControlName="license_no"/>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="date" placeholder="Date of Birth dd/MM/yyyy" formControlName="dob"/>
            </div>
          </div>
         </div>

          <div class="row input-wrapper mt-4">    
           <div class="col-md-12 d-flex justify-content-start" >
             <Span style="font-size: large; color: black; font-weight: 500;">Driving License</Span>
           </div>
          </div>

        <!-- <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Upload Front Image"/>
                <img src="assets/images/Camera-Icon.png">
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Upload Back Image"/>
                <img src="assets/images/Camera-Icon.png">
            </div>
          </div>
         </div> -->


      <!-- DL IMAGES -->
      <div class="row input-wrapper mt-4">    
        <div class="col-md-6">
          <div class="input-box">
            <img *ngIf="driverFormPersonalInformation.value.dl_front_img"[src]="driverFormPersonalInformation.value.dl_front_img" width="120" class="ml-3" />
            <input type="file" hidden #frontInput (change)="onFileChange($event, 'dl_front_img')" />
            <input type="text" placeholder="Upload Front Image" [value]="frontFileName || ''" readonly (click)="frontInput.click()"/>
            <img src="assets/images/Camera-Icon.png" (click)="frontInput.click()" style="cursor:pointer;">
          </div>
        </div>

        <div class="col-md-6">
          <div class="input-box">
            <img *ngIf="driverFormPersonalInformation.value.dl_back_img" [src]="driverFormPersonalInformation.value.dl_back_img" width="120" class="ml-3" />
            <input type="file" hidden #backInput (change)="onFileChange($event, 'dl_back_img')" />
            <input type="text" placeholder="Upload Back Image" [value]="backFileName || ''" readonly (click)="backInput.click()"/>
            <img src="assets/images/Camera-Icon.png" (click)="backInput.click()" style="cursor:pointer;">
          </div>
        </div>
      </div>


        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Phone Number" formControlName="phone_number"/>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Full Name As Per DL" formControlName="full_name"/>
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Nick Name" formControlName="nick_name"/>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Type Email Id" formControlName="email"/>
            </div>
          </div>
         </div>

         <button type="button" class="verify-btn" style="margin-left: -40px; margin-top: 60px;" (click)="onNext()">Next</button> <!-- (click)="toggleInformationButton()"-->
       </form>
     </div>


      <!--For Kyc info-->
     <div class="form-wrapper" *ngIf="!informationEnable && !driverDetailsEnable">
       <form [formGroup]="driverFormAddressKyc">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Building , Apartment" formControlName="building"/>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Street , Area" formControlName="street"/>
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Pincode" formControlName="pincode" (change)="getPincodeLocation($event)"/>
                <!-- <img src="assets/images/Camera-Icon.png"> -->
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Town/Tahsil" formControlName="tahsil"/>
                <!-- <img src="assets/images/Camera-Icon.png"> -->
            </div>
          </div>
         </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-6">
            <div class="input-box">
                <select formControlName="state" (click)="getStateData()">
                  <Option selected disabled value="">SelectState</Option>
                  <option *ngFor="let state of stateList" [value]="state.state">{{state.state}}</option>
                </select>
            </div>
          </div>
           <div class="col-md-6">
            <div class="input-box">
               <select formControlName="destrict" style="border: none; outline: none; width: 100%;" (click)="getCityData()">
                  <Option selected disabled value="">District</Option>
                  <option *ngFor="let city of cityList" [value]="city.region">{{city.region}}</option>
                </select>
            </div>
          </div>
         </div>

         <div class="row input-wrapper mt-4">    
           <div class="col-md-12 d-flex justify-content-start" >
             <Span style="font-size: large; color: black; font-weight: 500;">Adhaar Card</Span>
           </div>
          </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="Adhaar Card Number" formControlName="adhaar"/>
            </div>
          </div>

        <div class="col-md-4">
          <div class="input-box">
            <img *ngIf="driverFormAddressKyc.value.adhaar_front_img"[src]="driverFormAddressKyc.value.dl_front_img" width="120" class="ml-3" />
            <input type="file" hidden #frontInputAdhaar (change)="onFileChangeAdd($event, 'adhaar_front_img')" />
            <input type="text" placeholder="Upload Front Image" [value]="frontFileName || ''" readonly (click)="frontInputAdhaar.click()"/>
            <img src="assets/images/Camera-Icon.png" (click)="frontInputAdhaar.click()" style="cursor:pointer;">
          </div>
        </div>

        <div class="col-md-4">
          <div class="input-box">
            <img *ngIf="driverFormAddressKyc.value.adhaar_back_img" [src]="driverFormAddressKyc.value.dl_back_img" width="120" class="ml-3" />
            <input type="file" hidden #backInputAdhaar (change)="onFileChangeAdd($event, 'adhaar_back_img')" />
            <input type="text" placeholder="Upload Back Image" [value]="backFileName || ''" readonly (click)="backInputAdhaar.click()"/>
            <img src="assets/images/Camera-Icon.png" (click)="backInputAdhaar.click()" style="cursor:pointer;">
          </div>
        </div>
      
           <!-- <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="Front Image"/>
                <img src="assets/images/Camera-Icon.png">
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="Back Image"/>
                <img src="assets/images/Camera-Icon.png">
            </div>
          </div> -->

        </div>

        <div class="row input-wrapper mt-4">    
          <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="Name Of Family Member" formControlName="familyMemberApp"/>
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box">
                <input type="text" placeholder="Phone Number" formControlName="phoneNumber"/>
            </div>
          </div>
           <div class="col-md-4">
            <div class="input-box">
                <select formControlName="realation">
                   <Option selected disabled value="">Realation</Option>
                   <Option value="Mother">Mother</Option>
                   <Option  value="Father">Father</Option>
                </select>
            </div>
          </div>
         </div>

         <button type="button" class="verify-btn" style="margin-left: -40px; margin-top: 50px;" (click)="toggleDriverDetailsButton()">Next</button>
       </form>
     </div>

     
    <!--Infomation of Driver-->
     <div class="form-wrapper mt-0" *ngIf="driverDetailsEnable">
        <div class="row input-wrapper">    
          <div class="col-md-6">
            <div class="input-box">
                <input type="text" placeholder="Driving License" [(ngModel)]="drivingLicense"/>
            </div>
          </div>
           <div class="col-md-3">
            <div class="input-box">
                <input type="text" placeholder="Date Of Birth"  [(ngModel)]="driverDob"/>
            </div>
          </div>
         </div>
         
         <!-- <div class="row input-wrapper mt-3">    
           <div class="col-md-12 d-flex justify-content-center" >
              <button type="button" class="verify-btn" (click)="verifyLicense()">Verify License</button>
           </div>
          </div> -->

          <div class="row input-wrapper mt-3">    
            <div class="col-md-12 d-flex justify-content-center">
              <button *ngIf="isVerifying" class="verify-btn" disabled>
                <span class="spinner-border spinner-border-sm"></span>Verifying...
              </button>
              <button *ngIf="!isVerifying && isLicenseVerified" class="verify-btn verified-btn" disabled>
                ✔ Verified
              </button>
              <button *ngIf="!isVerifying && !isLicenseVerified" type="button" class="verify-btn" (click)="verifyLicense()">
                Verify License
              </button>

            </div>
          </div>
        
         <div *ngIf="!isVerifying && isLicenseVerified" class="mt-3">
          <div class="row input-wrapper mt-2">    
            <div class="col-md-12 d-flex justify-content-start" >
              <div class="head">
                <h2>Information As Per Driving License</h2>
                <div class="underline-driving"></div>
              </div>
            </div>
          </div>  

          <div class="row input-wrapper mt-2">    
            <div class="col-md-6">
              <div class="input-box">
                  <input type="text" placeholder="Full Name As Per DL" [(ngModel)]="drivingLicenseName"/>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-box">
                  <input type="text" placeholder="Address As Per Driving License" [(ngModel)]="drivingLicenseAddress"/>
              </div>
            </div>
          </div>

          <div class="row input-wrapper mt-4">    
            <div class="col-md-12">
            <table class="infomation-table">
                <thead>
                  <th>Code</th>
                  <th>Date Of Issue</th>
                  <th>Date Of Expiry</th>
                </thead>
                <tbody>
                  <tr><!-- *ngFor="let driver of drivers"-->
                    <td>{{driversDetailsByLicense.cov_details[1].cov}}</td>
                    <td>{{driversDetailsByLicense.t_validity_from}}</td>
                    <td>{{driversDetailsByLicense.t_validity_to}}</td>
                  </tr>
                </tbody>
            </table>
            </div>
          </div>
          <button type="button" class="verify-btn" style="margin-left: -40px; margin-top: 30px;" (click)="submitDriverData()">Submit</button><!--routerLink="/driverList"-->
         </div> 

     </div>
  </div>


</div>
