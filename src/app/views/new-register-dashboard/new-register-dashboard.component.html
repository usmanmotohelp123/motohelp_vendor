<div class="profile-container">

<div class="stepper-wraper" >   
  <div class="stepper-box">

    <div class="stepper">

      <div class="step completed">
        <div class="circle"></div>
      </div>

      <div class="line" [ngClass]="isVehicle !== 'N' ? 'active' : ''"></div>

      <div class="step" [ngClass]="isVehicle === 'N' ? 'inactive' : 'completed'">
        <div class="circle" [ngClass]="isVehicle === 'N' ? 'inactive' : 'completed'"></div>
      </div>

      <div class="line" [ngClass]="isVehicle !== 'N' ? 'active' : ''"></div>

      <div class="step" [ngClass]="isVehicle === 'N' ? 'inactive' : 'completed'">
        <div class="circle" [ngClass]="isVehicle === 'Y' ? 'inactive' : 'completed'"></div>
      </div>

    </div>
  </div>

    <div class="step-text">
      <div>
        <h4>Registration</h4>
        <p>Registration Completed Successfully</p>
      </div>

      <div>
        <h4>Validate Vehicle</h4>
        <p>Validate at least 1 vehicle to proceed</p>
      </div>

      <div>
        <h4>KYC Verification</h4>
        <p>KYC unlocks after adding 1 vehicle</p>
      </div>
    </div>

</div>


  <!-- CARDS -->
   
  <div class="card-wrapper" *ngIf="!validateVehicle && !addKyc">

    <!-- VEHICLE CARD -->
    <div class="custom-card">
      <img src="assets/images/Vehicle.png" class="card-icon">

      <h3>Validate Vehicle</h3>
      <p>{{vehiclesCount}} Added</p>

      <button class="btn-primary" (click)="validateVehicleEnable()">Add</button>
    </div>

    <!-- KYC CARD -->
    <div class="custom-card disabled">
      <img src="assets/images/Bank.png" class="card-icon">

      <h3>Bank Details</h3>
      <p *ngIf="isVehicle === 'N'" class="locked">Locked</p>
      <p *ngIf="isVehicle === 'Y'" class="locked">Add Bank Kyc</p>

      <button *ngIf="isVehicle === 'N'" class="btn-disabled">Unlock</button>
      <button *ngIf="isVehicle === 'Y'" class="btn-primary" (click)="validateBankEnable()">Add</button>
    </div>

  </div>

  <div class="validate-vehicles" *ngIf="validateVehicle">
     <app-validate-vehicle></app-validate-vehicle>
  </div>

   <div class="validate-vehicles" *ngIf="addKyc">
     <app-add-bank></app-add-bank>
  </div>

</div>
