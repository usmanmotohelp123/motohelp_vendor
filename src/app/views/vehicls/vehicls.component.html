 <div class="container-fluid main">
    <div class="row header" style="border-bottom: 2px solid #d2d2d2;">
        <div class="col-sm-12 d-flex" style="align-items: center; justify-content: center;">
          <h1 style="font-weight: 700;
            font-size: 1.7rem;
            margin-bottom: 1px;
            margin-top: 5px; color: rgb(120, 118, 118); ">Vehicle</h1>
        </div>  
     </div> 

 <div class="data-list">

    <!-- Empty State -->
    <div *ngIf="vehicles.length === 0" class="data-empty">
        No vehicles added yet
    </div>

    <table *ngIf="vehicles.length > 0" class="data-table">

        <thead>
        <tr class="text-center">
            <th>Validated</th>
            <th>Sr.No</th>
            <th>Vehicle No</th>
            <th>Type</th>
            <th>Model</th>
            <th>Capacity</th>
            <th>Status</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let v of vehicles; let i = index">
            <td>
              <button *ngIf="v.validationState === 'idle'" class="btn btn-primary btn-sm" (click)="validateVehicle(i)">
                Validate
              </button>
              <div *ngIf="v.validationState === 'loading'" class="spinner"></div>
              <i *ngIf="v.validationState === 'validated'" class="fa-solid fa-circle-check text-success fs-5"></i>
            </td>
            <td>{{ i + 1 }}</td>
            <td class="fw-semibold text-nowrap">{{ v.vehicleNo }}</td>
            <td>{{ v.type }}</td>
            <td>{{ v.model }}</td>
            <td>{{ v.capacity }}</td>
            <td>{{ v.status }}</td>
            <td class="text-center action-cell">
            <button class="icon-btn edit" title="Edit" (click)="editVehicle(v,i)">
                <i class="fa fa-pen"></i>
            </button>
            <button class="icon-btn delete" title="Delete" (click)="deleteVehicle(i)">
                <i class="fa fa-trash"></i>
            </button>
            </td>
        </tr>
        </tbody>

    </table>

 </div>


 <button  (click)="addVehicle()"
    (mouseenter)="isHover=true"
    (mouseleave)="isHover=false"
    [style.transform]="isHover ? 'scale(1.1)' : 'scale(1)'"
    [style.boxShadow]="isHover ? '0 6px 16px rgba(0,0,0,.45)' : '0 6px 18px rgba(0,0,0,.35)'"
    style="position: fixed;
        bottom: 30px;
        right: 15px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #0159b0;
        color: #fff;
        font-size: 32px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(0,0,0,.35);
        z-index: 1000;">+</button>

</div>
