<div class="sidebar">

  <!-- LOGO -->
  <div class="logo">
    <img src="assets/images/Vendor-logo-s.png" alt="logo">
  </div>

  <!-- MENU -->
  <div class="menu">

    <!-- HOME(click)="goHomeMenu()" -->
    <div class="menu-item"  routerLink="/vendorDashboard" routerLinkActive="active-menu" [routerLinkActiveOptions]="{exact:true}">
      <img src="assets/images/sidebar-icon/Home-Icon.png">
      <span>Home</span>
    </div>


    <div class="menu-item" (click)="profile()">
      <img src="assets/images/sidebar-icon/Profile-Icon.png">
      <span>Profile</span>
    </div>

    <div class="menu-item" routerLinkActive="active-menu" *ngIf="isFlageEnable === 'Y'">
       <img src="assets/images/sidebar-icon/Operation-Icon.png">
       <span>Operation</span>
    </div>
   
    <div class="menu-item" routerLinkActive="active-menu" *ngIf="isFlageEnable === 'Y'">
        <img src="assets/images/sidebar-icon/Billing-Icon.png">
        <span>Billing</span>
    </div>

    <!-- <div class="menu-item">
      <img src="assets/images/sidebar-icon/History-Icon.png">
      <span>History</span>
    </div> -->

    <!-- VEHICLE -->
    <div class="menu-item has-submenu" routerLinkActive="active-menu" (click)="toggleMenu('vehicle', $event)">
      <div class="menu-link">
        <img src="assets/images/sidebar-icon/Vehicle-Icon.png">
        <span style="margin-left: 6px;">Vehicle</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu-popup" [class.show]="activeMenu === 'vehicle'">
        <div class="submenu-item">+ Add</div>
        <div class="submenu-item" routerLink="/assignVehicle">Assign Driver</div>
        <div class="submenu-item">Maintenance</div>
        <div class="submenu-item">Information</div>
        <div class="submenu-item" routerLink="/vehicleExpiry">Vehicle Expiry</div>
        <div class="submenu-item" routerLink="/discontinueVehicle">Discontinue</div>
      </div>
    </div>

    <!-- DRIVER -->
    <div class="menu-item has-submenu" routerLinkActive="active-menu" (click)="toggleMenu('driver', $event)">
      <div class="menu-link">
        <img src="assets/images/sidebar-icon/Driver-Icon.png">
        <span style="margin-left: 6px;">Driver</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu-popup" [class.show]="activeMenu === 'driver'">
        <div class="submenu-item" routerLink="/onboardDriver">Onboard</div>
        <div class="submenu-item">Log Details</div>
        <div class="submenu-item">Payment</div>
        <div class="submenu-item">Expense</div>
        <div class="submenu-item">Information</div>
        <div class="submenu-item" routerLink="/discontinueDriver">Discontinue</div>
      </div>
    </div>

    <div class="menu-item" routerLinkActive="active-menu" *ngIf="isFlageEnable === 'Y'">
      <img src="assets/images/sidebar-icon/Wallet-Icon.png">
      <span>Wallet</span>
    </div>

    <div class="menu-item" routerLinkActive="active-menu" routerLink="/tracking" *ngIf="isFlageEnable === 'Y'">
      <img src="assets/images/sidebar-icon/Tracking-Icon.png">
      <span>Tracking</span>
    </div>

    <!-- <div class="menu-item">
      <img src="assets/images/sidebar-icon/NewLoad-Icon.png">
      <span>New Load</span>
    </div> -->

    <!-- LOGOUT -->
    <div class="menu-item logout" (click)="logout()">
      <img src="assets/images/sidebar-icon/Logout-Icon.png">
      <span>Logout</span>
    </div>

  </div>
</div>
