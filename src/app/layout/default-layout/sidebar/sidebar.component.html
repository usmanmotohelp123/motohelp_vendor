<div class="sidebar">

  <!-- LOGO -->
  <div class="logo">
    <img src="assets/images/Vendor-logo-s.png" alt="logo">
  </div>

  <!-- MENU -->
  <div class="menu">

    <!-- HOME -->
    <div class="menu-item" (click)="goHomeMenu()">
      <img src="assets/images/sidebar-icon/Home-Icon.png">
      <span>Home</span>
    </div>

    <div class="menu-item">
      <img src="assets/images/sidebar-icon/History-Icon.png">
      <span>History</span>
    </div>

    <div class="menu-item">
      <img src="assets/images/sidebar-icon/Wallet-Icon.png">
      <span>Wallet</span>
    </div>

    <div class="menu-item" (click)="profile()">
      <img src="assets/images/sidebar-icon/Profile-Icon.png">
      <span>Profile</span>
    </div>

    <!-- VEHICLE -->
    <div class="menu-item has-submenu" (click)="toggleMenu('vehicle', $event)">
      <div class="menu-link">
        <img src="assets/images/sidebar-icon/Vehicle-Icon.png">
        <span style="margin-left: 6px;">Vehicle</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu-popup" [class.show]="activeMenu === 'vehicle'">
        <div class="submenu-item">+ Add</div>
        <div class="submenu-item">Assign Driver</div>
        <div class="submenu-item">Maintenance</div>
        <div class="submenu-item">Information</div>
        <div class="submenu-item">Expiry</div>
        <div class="submenu-item">Discontinue</div>
      </div>
    </div>

    <!-- DRIVER -->
    <div class="menu-item has-submenu" (click)="toggleMenu('driver', $event)">
      <div class="menu-link">
        <img src="assets/images/sidebar-icon/Driver-Icon.png">
        <span style="margin-left: 6px;">Driver</span>
        <span class="arrow">›</span>
      </div>
      <div class="submenu-popup" [class.show]="activeMenu === 'driver'">
        <div class="submenu-item">Onboard</div>
        <div class="submenu-item">Log Details</div>
        <div class="submenu-item">Payment</div>
        <div class="submenu-item">Expense</div>
        <div class="submenu-item">Information</div>
        <div class="submenu-item">Discontinue</div>
      </div>
    </div>

    <div class="menu-item">
      <img src="assets/images/sidebar-icon/NewLoad-Icon.png">
      <span>New Load</span>
    </div>

    <div class="menu-item">
       <img src="assets/images/sidebar-icon/Operation-Icon.png">
       <span>Operation</span>
    </div>
   
    <div class="menu-item">
        <img src="assets/images/sidebar-icon/Billing-Icon.png">
        <span>Billing</span>
    </div>

    <div class="menu-item">
      <img src="assets/images/sidebar-icon/Tracking-Icon.png">
      <span>Tracking</span>
    </div>

    <!-- LOGOUT -->
    <div class="menu-item logout" (click)="logout()">
      <img src="assets/images/sidebar-icon/Logout-Icon.png">
      <span>Logout</span>
    </div>

  </div>
</div>
