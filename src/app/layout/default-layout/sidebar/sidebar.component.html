<div class="sidebar" [class.collapsed]="collapsed">

      <img src="assets/images/sidebar-icon/Home-Icon.png">
      <span>Home</span>
    </div>
    <!-- TRACKING -->
    <div class="menu-item" routerLinkActive="active-menu" routerLink="/tracking" *ngIf="isProfileCompleted === true"  title="Tracking"><!--*ngIf="isFlageEnable === 'Y'"-->

      <span>Tracking History</span>
    </div>
    <!-- PROFILE -->
    <!-- <div class="menu-item" (click)="profile()" title="Profile">
      <img src="assets/images/sidebar-icon/Profile-Icon.png">
      <span>Profile</span>
    </div> -->
    <!-- OPERATION -->
    <div class="menu-item" routerLinkActive="active-menu" *ngIf="sharedService.isProfileCompleted() === true"  title="Operation"> <!--*ngIf="isFlageEnable === 'Y'"-->
      <img src="assets/images/sidebar-icon/Operation-Icon.png">
      <span>Operation</span>
    </div>
    <!-- BILLING -->
    <div class="menu-item" routerLinkActive="active-menu" *ngIf="sharedService.isProfileCompleted() === true"><!--*ngIf="isFlageEnable === 'Y'" title="Billing"-->
      <img src="assets/images/sidebar-icon/Billing-Icon.png">
      <span>Billing</span>
    </div>

    <div class="menu-item has-submenu" routerLinkActive="active-menu" title="Vehicle">
      <div class="menu-link" (click)="toggleMenu('vehicle', $event)">
        <img src="assets/images/sidebar-icon/Vehicle-Icon.png">
        <span>Vehicle</span>
        <span class="arrow">
          <!-- {{ activeMenu === 'vehicle' ? '⌄' : '›' }} -->
            <img *ngIf="activeMenu === 'vehicle'" src="assets/images/figma-icons/down-arr.png">
            <img *ngIf="activeMenu !== 'vehicle'" src="assets/images/figma-icons/side-arr.png">
        </span>
      </div>
      <div class="submenu-popup"  [class.show]="activeMenu === 'vehicle'">
        <div class="submenu-item" routerLinkActive="router-link-active" routerLink="/addVehicle">
          Add / Verified
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active" routerLink="/assignVehicle">
          Assign Vehicle
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Maintenance
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Information
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active" routerLink="/vehicleExpiry">
          Expiry
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active" routerLink="/discontinueVehicle">
          Discontinue
        </div>
      </div>
    </div>

    <div class="menu-item has-submenu" routerLinkActive="active-menu" title="Driver">
      <div class="menu-link" (click)="toggleMenu('driver', $event)">
        <img src="assets/images/sidebar-icon/Driver-Icon.png">
        <span>Driver</span>
        <span class="arrow">
          <!-- {{ activeMenu === 'driver' ? '⌄' : '›' }} -->
            <img *ngIf="activeMenu === 'driver'" src="assets/images/figma-icons/down-arr.png">
            <img *ngIf="activeMenu !== 'driver'" src="assets/images/figma-icons/side-arr.png">
        </span>
      </div>
      <div class="submenu-popup"[class.show]="activeMenu === 'driver'">
        <div class="submenu-item" routerLinkActive="router-link-active"  (click)="sharedService.openOnboardModel()"> <!--routerLink="/onboardDriver"-->
          Onboard
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Log Details
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Payment
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Expense
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active">
          Information
        </div>
        <div class="submenu-item" routerLinkActive="router-link-active" routerLink="/discontinueDriver">
          Discontinue
        </div>
      </div>
    </div>

    <!-- WALLET -->
    <div class="menu-item" routerLinkActive="active-menu" *ngIf="sharedService.isProfileCompleted() === true" title="Wallet">
      <img src="assets/images/sidebar-icon/Wallet-Icon.png">
      <span>Wallet</span>
    </div>

    <!-- LOGOUT -->
    <div class="menu-item logout" (click)="logout()" title="Logout" style="margin-top: 1px;">
      <img src="assets/images/sidebar-icon/Logout-Icon.png">
      <span>Logout</span>
    </div>

    <div class="menu-item" style="min-height: 100%"></div>

  </div>

</div>

<div *ngIf="sharedService.showOnboardModel()" class="onboard-model">
  <button type="button" class="onboard-close-btn" (click)="sharedService.closeOnboardModel()" aria-label="Close"> &times;</button>
  <h5 class="onboard-title">Driver Onboard</h5>
  <div class="onboard-input-group">
    <label for="userId" class="onboard-label">User ID :</label>
    <input id="userId" type="text" class="form-control onboard-input" [(ngModel)]="onBoardId"/>
  </div>
  <div class="onboard-actions">
    <button type="button" class="onboard-verify-btn" (click)="verifyDriver()">
      Verify
    </button>
  </div>
</div>
